[project]
name = "stitch-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "deepagents>=0.7.38",
    "fastapi>=0.162.7",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "langgraph-store-mongodb>=0.4.0",
    "pillow>=13.0.0",
    "playwright>=1.65.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymongo>=4.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "resvg-py>=0.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mongomock>=4.3.0",
    "pytest>=9.2.0",
]
